# Tiny Tapeout project information
project:
  title:        "Protocol emulator"      # Project title
  author:       "Emon Sarkar"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four-thread programmable core that runs digital protocols as firmware, with cycle-exact pins"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sarkar22_pe"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # project.sv must stay first: the port check reads it alone, and rejects `import`.
  source_files:
    - "project.sv"
    - "pe_pkg.sv"
    - "pe_decode.sv"
    - "pe_core.sv"
    - "pe_thread.sv"
    - "pe_exec.sv"
    - "pe_regfile.sv"
    - "pe_mailbox.sv"
    - "pe_pins.sv"
    - "pe_mem.sv"
    - "pe_host.sv"
    - "pe_spi.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_CS"
  ui[1]: "HOST_SCK"
  ui[2]: "HOST_MOSI"
  ui[3]: "IN3"
  ui[4]: "IN4"
  ui[5]: "IN5"
  ui[6]: "IN6"
  ui[7]: "IN7"

  # Outputs
  uo[0]: "OUT0"
  uo[1]: "OUT1"
  uo[2]: "OUT2"
  uo[3]: "HOST_MISO"
  uo[4]: "OUT4"
  uo[5]: "OUT5"
  uo[6]: "OUT6"
  uo[7]: "OUT7"

  # Bidirectional pins
  uio[0]: "IO0"
  uio[1]: "IO1"
  uio[2]: "IO2"
  uio[3]: "IO3"
  uio[4]: "IO4"
  uio[5]: "IO5"
  uio[6]: "IO6"
  uio[7]: "IO7"

# Do not change!
yaml_version: 6
