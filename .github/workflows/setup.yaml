name: setup

# scripts/setup.sh on a fresh GitHub runner: installs the pinned tools, then runs the tests
on:
  push:
    paths:
      - scripts/setup.sh
      - test/requirements.txt
      - .github/workflows/setup.yaml
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: One-command setup, then the program checks and the RTL tests
        run: time scripts/setup.sh --install-iverilog

      - name: Disk used
        run: du -sh ~/ttsetup/venv ~/ttsetup/pdk tt

      - name: Run again, with every step already done
        shell: bash
        run: |
          time scripts/setup.sh --no-test | tee rerun.log
          test "$(grep -c -x -E 'already (at the pin|set up)' rerun.log)" = 3
